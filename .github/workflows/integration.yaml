name: Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: contact_db
          MYSQL_USER: app_user
          MYSQL_PASSWORD: app_pass
          MYSQL_ROOT_PASSWORD: app_pass
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend-test ./backend

      - name: Run Django container
        run: |
          docker run -d \
            --name backend \
            -p 8000:8000 \
            -e DB_NAME=contact_db \
            -e DB_USER=app_user \
            -e DB_PASSWORD=app_pass \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            backend-test


